        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stay-r5-capture"
          cd "$RUNNER_TEMP/stay-r5-capture"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

