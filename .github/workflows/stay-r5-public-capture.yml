          name: STAY-R5-PUBLIC-SCREENSHOTS
          path: |
            r5-captures/*.png
            r5-capture-evidence.json
          if-no-files-found: error

      - name: Remove temporary capture workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          rm -f .github/workflows/stay-r5-public-capture.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove STAY R5 capture workflow [skip ci]"
            git push origin HEAD:main
          fi
