          set -euo pipefail
          cd "$RUNNER_TEMP/stay-r5-capture"
          node capture.mjs

      - name: Collect capture evidence
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/stay-r5-capture/r5-capture-evidence.json" .
          rm -rf r5-captures
          cp -R "$RUNNER_TEMP/stay-r5-capture/r5-captures" ./r5-captures
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('r5-capture-evidence.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['repo_head_at_capture']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          d['app_source_commit']=subprocess.check_output(['git','log','-1','--format=%H','--','dpro-tutorial.js'],text=True).strip()
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

