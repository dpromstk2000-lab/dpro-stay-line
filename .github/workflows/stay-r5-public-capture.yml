name: STAY R5 Public Screenshot Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stay-r5-public-capture.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify newest R4 source forward-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -q 'STAY-R4-GUIDE-CENTER' dpro-tutorial.js
          grep -q 'STAY-TUTORIAL-STANDARD-V1.1-R4' dpro-tutorial.js
          grep -q 'STAY-R3-FIX01-CLOSE-DRAG-GUARD' dpro-tutorial.js
          test "$(grep -o 'STAY-F10-[0-9][0-9]' dpro-tutorial.js | sort -u | wc -l | tr -d ' ')" = "10"
          echo "repo_head=$(git rev-parse HEAD)"
          echo "app_source=$(git log -1 --format=%H -- dpro-tutorial.js)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repository
