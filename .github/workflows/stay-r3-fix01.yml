name: STAY R3 FIX01 Close Drag + FULL LIVE QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stay-r3-fix01.yml'

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply STAY R3 FIX01 close-drag guard
        shell: python
        run: |
          from pathlib import Path

          p = Path("dpro-tutorial.js")
          text = p.read_text(encoding="utf-8")
          marker = "// STAY-R3-FIX01-CLOSE-DRAG-GUARD"
          old = "function beginDrag(e){if(e.button!==undefined&&e.button!==0)return;const card=$('dproTutCard');"
          new = "function beginDrag(e){if(e.target instanceof Element&&e.target.closest('button,a,input,select,textarea,[role=\"button\"]'))return;if(e.button!==undefined&&e.button!==0)return;const card=$('dproTutCard');"
          if marker not in text:
              if old not in text:
                  raise SystemExit("expected R3 beginDrag signature not found; refusing blind patch")
              text = text.replace("'use strict';", "'use strict';\n" + marker, 1)
              text = text.replace(old, new, 1)
              p.write_text(text, encoding="utf-8", newline="\n")

          wf = Path('.github/workflows/stay-r3-fix01.yml')
          if wf.exists():
              wf.unlink()
      - name: Static R3 FIX01 safety QA
        shell: bash
        run: |
          set -euo pipefail
          test -s dpro-tutorial.js
          test -s dpro-tutorial.css
          node --check dpro-tutorial.js
          grep -q 'STAY-R3-FIX01-CLOSE-DRAG-GUARD' dpro-tutorial.js
          grep -Fq "e.target.closest('button,a,input,select,textarea,[role=\"button\"]')" dpro-tutorial.js
          for f in demo-guide.html index.html member.html staff.html owner.html; do
            grep -q 'dpro-tutorial.css' "$f"
            grep -q 'dpro-tutorial.js' "$f"
          done
          test "$(grep -o "STAY-F10-[0-9][0-9]" dpro-tutorial.js | sort -u | wc -l | tr -d ' ')" = "10"
          ! grep -q '/api/' dpro-tutorial.js
          ! grep -q 'demo=1' dpro-tutorial.js
          ! grep -q 'fetch(' dpro-tutorial.js
          ! grep -q 'XMLHttpRequest' dpro-tutorial.js
      - name: Commit R3 FIX01
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix STAY R3 close-drag pointer conflict [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for public GitHub Pages R3 FIX01
        shell: bash
        run: |
          set -euo pipefail
          url="https://dpromstk2000-lab.github.io/dpro-stay-line/dpro-tutorial.js"
          for i in $(seq 1 36); do
            if curl -fsSL "$url?cb=$GITHUB_RUN_ID-$i" | grep -q 'STAY-R3-FIX01-CLOSE-DRAG-GUARD'; then
              echo "Public Pages updated"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for GitHub Pages" >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Write R3 LIVE QA runner
        shell: python
        run: |
          import base64
          from pathlib import Path
          Path('r3-live-qa.mjs').write_text(base64.b64decode("").decode('utf-8'),encoding='utf-8',newline='\n')
      - name: R3 exact LIVE QA
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          node r3-live-qa.mjs
      - name: Add source commit to QA evidence
        if: always()
        shell: python
        env:
          R3_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          import json, os
          from pathlib import Path
          p=Path('r3-live-qa.json')
          if p.exists():
              d=json.loads(p.read_text())
          else:
              d={"phase":"R3","pass":False,"errors":["QA runner did not create evidence"]}
          d["source_commit"]=os.environ.get("R3_SHA","")
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
      - name: Upload R3 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STAY-R3-LIVE-QA-${{ steps.commit.outputs.sha }}
          path: r3-live-qa.json
          if-no-files-found: error
