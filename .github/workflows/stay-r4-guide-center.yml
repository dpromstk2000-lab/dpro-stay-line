name: STAY R4 Guide Center Apply + FULL LIVE QA V1.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stay-r4-guide-center.yml'

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Adopt newest main and verify R3 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git log -1 --format=%H -- dpro-tutorial.js)" = "205b7407f9a6376d8a298f5f7d5b09083ad8a94e"
