      - name: Collect R4 QA evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          src=Path(os.environ["RUNNER_TEMP"]) / "stay-r4-qa" / "r4-live-qa.json"
          if src.exists():
              d=json.loads(src.read_text(encoding="utf-8"))
          else:
              d={"phase":"R4","pass":False,"errors":["R4 QA runner did not create evidence"]}
          d["source_commit"]=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          d["r3_source_commit"]="205b7407f9a6376d8a298f5f7d5b09083ad8a94e"
          d["r3_full_pass_evidence"]="STAY-R3-PUBLIC-FULL-LIVE-QA-V11"
          Path("r4-live-qa.json").write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Upload R4 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STAY-R4-PUBLIC-FULL-LIVE-QA
          path: r4-live-qa.json
          if-no-files-found: error

      - name: Enforce R4 QA result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
