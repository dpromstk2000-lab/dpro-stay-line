name: STAY R4 Guide Center Apply + FULL LIVE QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stay-r4-guide-center.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Adopt newest main and verify R3 FULL PASS source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git log -1 --format=%H -- dpro-tutorial.js)" = "205b7407f9a6376d8a298f5f7d5b09083ad8a94e"
          grep -q 'STAY-R3-FIX01-CLOSE-DRAG-GUARD' dpro-tutorial.js
          grep -q "STAY-TUTORIAL-STANDARD-V1.1-R3" dpro-tutorial.js
          test "$(grep -o "STAY-F10-[0-9][0-9]" dpro-tutorial.js | sort -u | wc -l | tr -d ' ')" = "10"

      - name: Apply R4 Guide Center forward-only
        shell: python
        run: |
          import base64
          from pathlib import Path
          Path('dpro-tutorial.js').write_text(base64.b64decode("").decode('utf-8'),encoding='utf-8',newline='\n')
          Path('dpro-tutorial.css').write_text(base64.b64decode("").decode('utf-8'),encoding='utf-8',newline='\n')
          for name in [
              '.github/workflows/stay-r3-live-qa-only.yml',
              '.github/workflows/stay-r3-live-qa-only-v11.yml',
              '.github/workflows/stay-r3-fix01.yml',
              '.github/workflows/stay-r4-guide-center.yml',
          ]:
              p=Path(name)
              if p.exists():
                  p.unlink()

      - name: Static R4 safety and contract QA
        shell: bash
        run: |
          set -euo pipefail
          node --check dpro-tutorial.js
          grep -q 'STAY-R4-GUIDE-CENTER' dpro-tutorial.js
          grep -q 'STAY-R3-FIX01-CLOSE-DRAG-GUARD' dpro-tutorial.js
          grep -Fq "e.target.closest('button,a,input,select,textarea,[role=\"button\"]')" dpro-tutorial.js
          grep -q 'guideCount:STEPS.length' dpro-tutorial.js
          test "$(grep -o "STAY-F10-[0-9][0-9]" dpro-tutorial.js | sort -u | wc -l | tr -d ' ')" = "10"
          for f in demo-guide.html index.html member.html staff.html owner.html; do
            grep -q 'dpro-tutorial.css' "$f"
            grep -q 'dpro-tutorial.js' "$f"
          done
          ! grep -q '/api/' dpro-tutorial.js
          ! grep -q 'demo=1' dpro-tutorial.js
          ! grep -q 'fetch(' dpro-tutorial.js
          ! grep -q 'XMLHttpRequest' dpro-tutorial.js
          python - <<'PY'
          import subprocess
          allowed={
            'dpro-tutorial.js','dpro-tutorial.css',
            '.github/workflows/stay-r3-live-qa-only.yml',
            '.github/workflows/stay-r3-live-qa-only-v11.yml',
            '.github/workflows/stay-r3-fix01.yml',
            '.github/workflows/stay-r4-guide-center.yml',
          }
          changed={x for x in subprocess.check_output(['git','status','--short'],text=True).splitlines() for x in [x[3:]]}
          extra=changed-allowed
          if extra:
              raise SystemExit(f'unexpected changed files: {sorted(extra)}')
          PY

      - name: Commit R4
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add STAY R4 Guide Center with shared First10 [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright in isolated temp workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stay-r4-qa"
          cd "$RUNNER_TEMP/stay-r4-qa"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

      - name: Write R4 LIVE QA runner
        shell: python
        run: |
          import base64
          from pathlib import Path
          p=Path("${{ runner.temp }}")/'stay-r4-qa'/'r4-live-qa.mjs'
          p.write_text(base64.b64decode("").decode('utf-8'),encoding='utf-8',newline='\n')

      - name: R4 exact public FULL LIVE QA
        id: qa
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stay-r4-qa"
          node r4-live-qa.mjs

      - name: Add source commit to R4 evidence
        if: always()
        shell: python
        env:
          R4_SOURCE: ${{ steps.commit.outputs.sha }}
        run: |
          import json, os
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'stay-r4-qa'/'r4-live-qa.json'
          dst=Path('r4-live-qa.json')
          if src.exists():
              d=json.loads(src.read_text(encoding='utf-8'))
          else:
              d={"phase":"R4","pass":False,"errors":["R4 QA runner did not create evidence"]}
          d["source_commit"]=os.environ.get("R4_SOURCE","")
          d["r3_source_commit"]="205b7407f9a6376d8a298f5f7d5b09083ad8a94e"
          d["r3_full_pass_evidence"]="STAY-R3-PUBLIC-FULL-LIVE-QA-V11"
          dst.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')

      - name: Upload R4 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STAY-R4-PUBLIC-FULL-LIVE-QA-${{ steps.commit.outputs.sha }}
          path: r4-live-qa.json
          if-no-files-found: error

      - name: Enforce R4 QA result
        if: always()
        shell: bash
        env:
          QA_OUTCOME: ${{ steps.qa.outcome }}
        run: |
          set -euo pipefail
          test "$QA_OUTCOME" = "success"
