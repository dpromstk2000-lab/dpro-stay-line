      - name: Static R4 safety QA
        shell: bash
        run: |
          set -euo pipefail
          node --check dpro-tutorial.js
          grep -q 'STAY-R4-GUIDE-CENTER' dpro-tutorial.js
          grep -q 'STAY-R3-FIX01-CLOSE-DRAG-GUARD' dpro-tutorial.js
          python - <<'PY'
          from pathlib import Path
          text=Path("dpro-tutorial.js").read_text(encoding="utf-8")
          assert "function beginDrag(e){" in text
          assert "e.target instanceof Element&&e.target.closest('button,a,input,select,textarea," in text
          assert "return;if(e.button!==undefined&&e.button!==0)return;" in text
          PY
          grep -q 'guideCount:STEPS.length' dpro-tutorial.js
          test "$(grep -o 'STAY-F10-[0-9][0-9]' dpro-tutorial.js | sort -u | wc -l | tr -d ' ')" = "10"
          for f in demo-guide.html index.html member.html staff.html owner.html; do
            grep -q 'dpro-tutorial.css' "$f"
            grep -q 'dpro-tutorial.js' "$f"
          done
          ! grep -q '/api/' dpro-tutorial.js
          ! grep -q 'demo=1' dpro-tutorial.js
          ! grep -q 'fetch(' dpro-tutorial.js
          ! grep -q 'XMLHttpRequest' dpro-tutorial.js

      - name: Commit R4 forward-only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add STAY R4 Guide Center and clean QA residue [skip ci]"
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stay-r4-qa"
          cd "$RUNNER_TEMP/stay-r4-qa"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

