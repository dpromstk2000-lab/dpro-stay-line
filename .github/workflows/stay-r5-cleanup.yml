name: STAY R5 Cleanup + Public PDF Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stay-r5-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Adopt newest main and verify protected source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -q 'STAY-R4-GUIDE-CENTER' dpro-tutorial.js
          grep -q 'STAY-TUTORIAL-STANDARD-V1.1-R4' dpro-tutorial.js
          test "$(git log -1 --format=%H -- dpro-tutorial.js)" = "42ab1fe5d0dd724a2238f872c70faf2291ae9edc"
          test -s DPRO_TUTORIAL_STAY_QUICK_START_V1.0.pdf
          test -s DPRO_TUTORIAL_STAY_DETAILED_MANUAL_V1.0.pdf

      - name: Verify published PDFs by real HTTP
        shell: bash
        run: |
          set -euo pipefail
          QUICK='https://dpromstk2000-lab.github.io/dpro-stay-line/DPRO_TUTORIAL_STAY_QUICK_START_V1.0.pdf'
          DETAIL='https://dpromstk2000-lab.github.io/dpro-stay-line/DPRO_TUTORIAL_STAY_DETAILED_MANUAL_V1.0.pdf'
          for u in "$QUICK" "$DETAIL"; do
            code="$(curl -L --retry 6 --retry-delay 5 --retry-all-errors -sS -o /tmp/r5.pdf -w '%{http_code}' "$u")"
            test "$code" = "200"
            python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r5.pdf')
          b=p.read_bytes()
          assert b.startswith(b'%PDF-'), 'not a PDF response'
          assert len(b)>10000, 'PDF response too small'
          PY
          done
          python - <<'PY'
          import json, hashlib, subprocess
          from pathlib import Path
          d={
            "phase":"R5",
            "public_pdf_http":"PASS",
            "quick_url":"https://dpromstk2000-lab.github.io/dpro-stay-line/DPRO_TUTORIAL_STAY_QUICK_START_V1.0.pdf",
            "detailed_url":"https://dpromstk2000-lab.github.io/dpro-stay-line/DPRO_TUTORIAL_STAY_DETAILED_MANUAL_V1.0.pdf",
            "quick_repo_sha256":hashlib.sha256(Path("DPRO_TUTORIAL_STAY_QUICK_START_V1.0.pdf").read_bytes()).hexdigest(),
            "detailed_repo_sha256":hashlib.sha256(Path("DPRO_TUTORIAL_STAY_DETAILED_MANUAL_V1.0.pdf").read_bytes()).hexdigest(),
            "app_source_commit":subprocess.check_output(["git","log","-1","--format=%H","--","dpro-tutorial.js"],text=True).strip(),
            "business_mutation":0,
          }
          Path("r5-public-pdf-evidence.json").write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Remove only accidental R5 QA residue
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stay-r5-pdf-root-fix.yml
          rm -f .github/workflows/stay-r5-cleanup.yml
          rm -f DETAILED_FINAL_RENDER_PAGE_01.png
          rm -f DETAILED_FINAL_RENDER_PAGE_02.png
          rm -f DETAILED_FINAL_RENDER_PAGE_03.png
          rm -f DETAILED_FINAL_RENDER_PAGE_04.png
          rm -f DETAILED_FINAL_RENDER_PAGE_05.png
          rm -f DETAILED_FINAL_RENDER_PAGE_06.png
          rm -f QUICK_FINAL_RENDER_PAGE_01.png
          rm -f R5_ALL_PAGES_FINAL_RENDER_CONTACT_SHEET.jpg
          rm -f R5_MANUAL_INVENTORY.txt
          rm -f R5_PRIVACY_SAFETY.txt
          rm -f R5_QA_PRECHECK.json
          rm -f R5_QR_QA.json
          rm -f r5-capture-evidence.json
          rm -rf r5-captures

      - name: Verify cleanup scope
        shell: python
        run: |
          import subprocess
          allowed_prefixes={
            ".github/workflows/stay-r5-pdf-root-fix.yml",
            ".github/workflows/stay-r5-cleanup.yml",
            "DETAILED_FINAL_RENDER_PAGE_01.png",
            "DETAILED_FINAL_RENDER_PAGE_02.png",
            "DETAILED_FINAL_RENDER_PAGE_03.png",
            "DETAILED_FINAL_RENDER_PAGE_04.png",
            "DETAILED_FINAL_RENDER_PAGE_05.png",
            "DETAILED_FINAL_RENDER_PAGE_06.png",
            "QUICK_FINAL_RENDER_PAGE_01.png",
            "R5_ALL_PAGES_FINAL_RENDER_CONTACT_SHEET.jpg",
            "R5_MANUAL_INVENTORY.txt",
            "R5_PRIVACY_SAFETY.txt",
            "R5_QA_PRECHECK.json",
            "R5_QR_QA.json",
            "r5-capture-evidence.json",
          }
          changed=[]
          for line in subprocess.check_output(["git","status","--short"],text=True).splitlines():
              path=line[3:]
              if path=="r5-public-pdf-evidence.json":
                  continue
              if path.startswith("r5-captures/"):
                  continue
              if path not in allowed_prefixes:
                  changed.append(path)
          if changed:
              raise SystemExit("Unexpected cleanup scope: "+repr(changed))

      - name: Commit cleanup forward-only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Clean STAY R5 QA residue [skip ci]"
            git push origin HEAD:main
          fi
          test "$(git log -1 --format=%H -- dpro-tutorial.js)" = "42ab1fe5d0dd724a2238f872c70faf2291ae9edc"

      - name: Upload R5 public PDF evidence
        uses: actions/upload-artifact@v4
        with:
          name: STAY-R5-PUBLIC-PDF-EVIDENCE
          path: r5-public-pdf-evidence.json
          if-no-files-found: error
