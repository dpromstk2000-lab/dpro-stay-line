name: DPRO CHAT B R2 STAY Public Demo Safety

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository guard
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "dpromstk2000-lab/dpro-stay-line"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal R2 fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('demo-guide.html'); s=p.read_text(encoding='utf-8')
          def rep(a,b):
              global s
              if a not in s: raise SystemExit('expected copy not found: '+a[:130])
              s=s.replace(a,b)
          repls=[
          ('<div class="kicker">PUBLIC OPERATION DEMO / V1.0</div>','<div class="kicker">DPRO 宿泊施設 LINE / 公開操作デモ</div>'),
          ('<small>CHOOSE A SCREEN</small>','<small>画面を選ぶ</small>'),
          ('<small>RECOMMENDED JOURNEY</small>','<small>おすすめの確認順</small>'),
          ('"label": "GUEST FLOW"','"label": "宿泊者の流れ"'),
          ('"label": "DEMO INFO"','"label": "デモについて"'),
          ('"text": "管理画面コード 1234 / 架空データのみ"','"text": "管理画面はデモ用の認証情報を自動設定 / 架空データのみ"'),
          ('"label": "SCREEN STRUCTURE"','"label": "画面構成"'),
          ('"text": "4画面で5ステップ（04–05は同じOWNER PC）"','"text": "4画面で5つの流れを確認（04–05は同じオーナーPC）"'),
          ('"step": "01 / GUEST / PRIMARY EXPERIENCE"','"step": "01 / 宿泊者 / はじめに"'),
          ('"step": "02 / GUEST / MEMBER PAGE"','"step": "02 / 宿泊者 / マイページ"'),
          ('"step": "03 / STAFF / FIELD OPERATIONS"','"step": "03 / スタッフ / 当日運営"'),
          ('"note": "管理コードは 1234。デモURLではコードを自動設定し、営業デモを初期化できます。"','"note": "デモURLではデモ用の認証情報を自動設定し、営業デモを初期化できます。"'),
          ('"step": "04–05 / OWNER PC / SAME SCREEN"','"step": "04–05 / オーナーPC / 同じ画面"'),
          ('"note": "管理コードは 1234。04の忘れ物対応と05の施設管理は同じOWNER PC内で確認します。"','"note": "04の忘れ物対応と05の施設管理は同じオーナーPC内で確認します。デモ用の認証情報は自動設定されます。"'),
          ('document.getElementById("footer").textContent = `${CONFIG.systemName}｜PUBLIC OPERATION DEMO V1.0`;','document.getElementById("footer").textContent = `${CONFIG.systemName}｜公開操作デモ`;'),
          ('${x.sameScreen ? " / SAME SCREEN" : ""}','${x.sameScreen ? " / 同じ画面" : ""}'),
          ('>Owner PCへ戻る</a>','>オーナーPCへ戻る</a>')
          ]
          for a,b in repls: rep(a,b)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Static safety QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('demo-guide.html').read_text(encoding='utf-8')
          assert s.count('1234') == 1, s.count('1234')
          assert '"adminCode": "1234"' in s
          for x in ['PUBLIC OPERATION DEMO / V1.0','管理画面コード 1234','管理コードは 1234','OWNER PC','SAME SCREEN']:
              assert x not in s, x
          for x in ['公開操作デモ','オーナーPCへ戻る','"adminCode": "1234"','デモ用の認証情報を自動設定']:
              assert x in s, x
          assert 'dpro-tutorial.js' in s and 'data-dpro-tutorial="stay-v1-1"' in s
          PY
          git diff --check

      - name: Commit forward-only fix
        shell: bash
        run: |
          git config user.name "DPRO CHAT B R2"
          git config user.email "actions@users.noreply.github.com"
          git rm ".github/workflows/dpro-chat-b-r2-public-guide-safety.yml"
          git add demo-guide.html
          git commit -m "DPRO CHAT B R2: public guide and demo safety"
          git push
