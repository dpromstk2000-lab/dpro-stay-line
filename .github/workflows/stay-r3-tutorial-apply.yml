name: STAY R3 Tutorial Apply + LIVE QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stay-r3-tutorial-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply STAY Tutorial R3
        shell: python
        run: |
          import base64
          from pathlib import Path

          js = base64.b64decode("").decode("utf-8")
          css = base64.b64decode("").decode("utf-8")
          Path("dpro-tutorial.js").write_text(js, encoding="utf-8", newline="\n")
          Path("dpro-tutorial.css").write_text(css, encoding="utf-8", newline="\n")

          head_tag = '<link rel="stylesheet" href="dpro-tutorial.css" data-dpro-tutorial="stay-v1-1">'
          body_tag = '<script src="dpro-tutorial.js" data-dpro-tutorial="stay-v1-1"></script>'
          targets = ["demo-guide.html", "index.html", "member.html", "staff.html", "owner.html"]
          for name in targets:
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              if head_tag not in text:
                  if "</head>" not in text:
                      raise SystemExit(f"missing </head>: {name}")
                  text = text.replace("</head>", f"{head_tag}\n</head>", 1)
              if body_tag not in text:
                  if "</body>" not in text:
                      raise SystemExit(f"missing </body>: {name}")
                  text = text.replace("</body>", f"{body_tag}\n</body>", 1)
              p.write_text(text, encoding="utf-8", newline="\n")

          wf = Path('.github/workflows/stay-r3-tutorial-apply.yml')
          if wf.exists():
              wf.unlink()
      - name: Static R3 safety QA
        shell: bash
        run: |
          set -euo pipefail
          test -s dpro-tutorial.js
          test -s dpro-tutorial.css
          node --check dpro-tutorial.js
          for f in demo-guide.html index.html member.html staff.html owner.html; do
            grep -q 'dpro-tutorial.css' "$f"
            grep -q 'dpro-tutorial.js' "$f"
          done
          test "$(grep -o "STAY-F10-[0-9][0-9]" dpro-tutorial.js | sort -u | wc -l | tr -d ' ')" = "10"
          ! grep -q '/api/' dpro-tutorial.js
          ! grep -q 'demo=1' dpro-tutorial.js
          ! grep -q 'fetch(' dpro-tutorial.js
          ! grep -q 'XMLHttpRequest' dpro-tutorial.js
      - name: Commit R3 implementation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add STAY Tutorial R3 standard v1.1 [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for public GitHub Pages R3
        shell: bash
        run: |
          set -euo pipefail
          url="https://dpromstk2000-lab.github.io/dpro-stay-line/dpro-tutorial.js"
          for i in $(seq 1 36); do
            if curl -fsSL "$url?cb=$GITHUB_RUN_ID-$i" | grep -q 'STAY-TUTORIAL-STANDARD-V1.1-R3'; then
              echo "Public Pages updated"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for GitHub Pages" >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Write R3 LIVE QA runner
        shell: python
        run: |
          import base64
          from pathlib import Path
          Path('r3-live-qa.mjs').write_text(base64.b64decode("").decode('utf-8'),encoding='utf-8',newline='\n')
      - name: R3 exact LIVE QA
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          node r3-live-qa.mjs
      - name: Add source commit to QA evidence
        if: always()
        shell: python
        env:
          R3_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          import json, os
          from pathlib import Path
          p=Path('r3-live-qa.json')
          if p.exists():
              d=json.loads(p.read_text())
          else:
              d={"phase":"R3","pass":False,"errors":["QA runner did not create evidence"]}
          d["source_commit"]=os.environ.get("R3_SHA","")
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
      - name: Upload R3 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STAY-R3-LIVE-QA-${{ steps.commit.outputs.sha }}
          path: r3-live-qa.json
          if-no-files-found: error
