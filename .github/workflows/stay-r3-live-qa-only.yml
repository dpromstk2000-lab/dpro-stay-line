name: STAY R3 Public FULL LIVE QA Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stay-r3-live-qa-only.yml'

permissions:
  contents: write

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify committed R3 FIX01 source
        shell: bash
        run: |
          set -euo pipefail
          test -s dpro-tutorial.js
          test -s dpro-tutorial.css
          node --check dpro-tutorial.js
          grep -q 'STAY-R3-FIX01-CLOSE-DRAG-GUARD' dpro-tutorial.js
          test "$(grep -o "STAY-F10-[0-9][0-9]" dpro-tutorial.js | sort -u | wc -l | tr -d ' ')" = "10"
          ! grep -q '/api/' dpro-tutorial.js
          ! grep -q 'demo=1' dpro-tutorial.js
          ! grep -q 'fetch(' dpro-tutorial.js
          ! grep -q 'XMLHttpRequest' dpro-tutorial.js

      - name: Capture source evidence
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "repo_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "app_source=$(git log -1 --format=%H -- dpro-tutorial.js)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

      - name: Write R3 LIVE QA runner
        shell: python
        run: |
          import base64
          from pathlib import Path
          Path('r3-live-qa.mjs').write_text(base64.b64decode("").decode('utf-8'),encoding='utf-8',newline='\n')

      - name: R3 exact public FULL LIVE QA
        id: qa
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          node r3-live-qa.mjs

      - name: Add source commit to QA evidence
        if: always()
        shell: python
        env:
          REPO_HEAD: ${{ steps.source.outputs.repo_head }}
          APP_SOURCE: ${{ steps.source.outputs.app_source }}
        run: |
          import json, os
          from pathlib import Path
          p=Path('r3-live-qa.json')
          if p.exists():
              d=json.loads(p.read_text(encoding='utf-8'))
          else:
              d={"phase":"R3","pass":False,"errors":["QA runner did not create evidence"]}
          d["repo_head_at_qa"]=os.environ.get("REPO_HEAD","")
          d["app_source_commit"]=os.environ.get("APP_SOURCE","")
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')

      - name: Upload R3 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STAY-R3-PUBLIC-FULL-LIVE-QA-${{ steps.source.outputs.app_source }}
          path: r3-live-qa.json
          if-no-files-found: error

      - name: Remove temporary QA workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          rm -f .github/workflows/stay-r3-live-qa-only.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove STAY R3 QA-only workflow [skip ci]"
            git push origin HEAD:main
          fi

      - name: Enforce R3 QA result
        if: always()
        shell: bash
        env:
          QA_OUTCOME: ${{ steps.qa.outcome }}
        run: |
          set -euo pipefail
          test "$QA_OUTCOME" = "success"
